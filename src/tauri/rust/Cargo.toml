[package]
name = "sefer"
version = "0.6.5"
description = "A scripture editor"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
openssl = { version = "0.10", features = ["vendored"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri-plugin-fs = "2"
git2 = { version = "0.20.2", features = ["https", "ssh"] }
tauri-plugin-os = "2"
md-5 = "0.10.0"
tauri-plugin-dialog = "2"
# Stateless editor commands still use Onion directly; resident ownership and
# packed publication/restore now come from the direct native Braid handle.
usfm_onion = { git = "https://github.com/WycliffeAssociates/usfm-onion.git", tag = "v0.1.4" }
ssc-core = { git = "https://github.com/WycliffeAssociates/scripture-sous-chef.git", tag = "v0.0.5" }
ssc-galley = { git = "https://github.com/WycliffeAssociates/scripture-sous-chef.git", tag = "v0.0.5", features = [
  "parallel",
] }
ssc-wire = { git = "https://github.com/WycliffeAssociates/scripture-sous-chef.git", tag = "v0.0.5" }
rayon = "1.10.0"
# Braid is the sole native resident engine and owns its packed publication
# reuse cache and restore composition; no app-owned host/envelope is needed.
braid = { git = "https://github.com/WycliffeAssociates/usfm-onion.git", tag = "v0.1.4", package = "braid" }
usfm_onion_wire = { git = "https://github.com/WycliffeAssociates/usfm-onion.git", tag = "v0.1.4", package = "usfm_onion_wire" }
zip = "2.4.2"
reqwest = { version = "0.12.23", default-features = false, features = [
  "blocking",
  "rustls-tls",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2.4.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.dev]
incremental = true
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 1
debug = false

# EXAMPLE USAGE:
#
#   Refer for explanation to following link:
#   https://lefthook.dev/configuration
pre-commit:
  parallel: true
  commands:
    lint:
      skip:
        - ref: master
      glob: "*.{ts,tsx,js,jsx}"
      # format + autofix ONLY the staged files (not the whole repo) so lint
      # isn't muddying the diff. Non-blocking off master.
      run: pnpm exec oxfmt {staged_files} && pnpm exec oxlint --fix {staged_files} || true
      stage_fixed: true
    lint-master:
      only:
        - ref: master
      glob: "*.{ts,tsx,js,jsx}"
      # block master commits on format/lint/type errors
      run: pnpm exec oxfmt {staged_files} && pnpm exec oxlint --fix {staged_files} && pnpm run check
      stage_fixed: true
    sync-versions:
      only:
        - ref: master
      run: node scripts/syncVersions.js
      stage_fixed: true

pre-push:
  commands:
    knip-master:
      only:
        - ref: master
      # knip failures fail CI; catch them before the push that triggers it
      run: pnpm run knip
